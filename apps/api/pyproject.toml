[project]
name = "ainet-api"
version = "0.1.0"
description = "AiNetwork backend (FastAPI modular monolith)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy[asyncio]>=2.0.32",
  "asyncpg>=0.29",
  "alembic>=1.13",
  "pgvector>=0.3",
  "redis>=5.0",
  "arq>=0.26",
  "httpx>=0.27",
  "python-ulid>=2.7",
  "structlog>=24.4",
  "pyjwt>=2.9",
  "cryptography>=43",
  "tenacity>=9.0",
  "sentry-sdk[fastapi]>=2.12",
  "prometheus-client>=0.26.0",
  "anthropic>=2.8.0",
  "langfuse>=5.2.0",
  "pywebpush>=2.5.0",
  "boto3>=1.44.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "hypothesis>=6.110", "respx>=0.21",
  "ruff>=0.6", "mypy>=1.11", "import-linter>=2.0", "polyfactory>=2.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.ruff.lint]
select = ["E","F","I","B","UP","S","BLE","TRY","ASYNC","PT","SIM","RUF"]
ignore = ["UP046","UP047","TRY003","S101","RUF012","B008","PT018","TRY300","TRY301","SIM108","S311","E731"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S","BLE"]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_ignores = false
plugins = ["pydantic.mypy"]
[[tool.mypy.overrides]]
module = ["arq.*","pgvector.*","tests.*","migrations.*","boto3.*","botocore.*","pywebpush.*"]
ignore_errors = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[tool.importlinter]
root_package = "app"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core and adapters never import modules"
type = "forbidden"
source_modules = ["app.core", "app.adapters"]
forbidden_modules = ["app.modules"]

[[tool.importlinter.contracts]]
name = "vendor SDKs only inside adapters"
type = "forbidden"
source_modules = ["app.modules", "app.core", "app.bootstrap", "app.registry"]
forbidden_modules = ["anthropic", "langfuse", "pywebpush", "boto3", "botocore"]
ignore_imports = ["app.core.observability -> sentry_sdk"]

[[tool.importlinter.contracts]]
name = "only the ai module uses the LLM and embedding ports"
type = "forbidden"
source_modules = ["app.modules"]
forbidden_modules = ["app.adapters.llm", "app.adapters.embeddings"]
allow_indirect_imports = true
ignore_imports = ["app.modules.ai.** -> app.adapters.llm.**", "app.modules.ai.** -> app.adapters.embeddings.**"]
