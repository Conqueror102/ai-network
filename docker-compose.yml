# Local dev stack: `docker compose up`. Fake adapters by default, no vendor keys needed.
x-api: &api
  build: { context: apps/api, dockerfile: ../../infra/docker/Dockerfile }
  environment: &env
    ENV: dev
    DATABASE_URL: postgresql+asyncpg://postgres@db:5432/ainet
    REDIS_URL: redis://redis:6379/0
  depends_on:
    db: { condition: service_healthy }
    redis: { condition: service_started }
services:
  db:
    image: pgvector/pgvector:pg16
    # local-only database with no password; never expose this port publicly
    environment: { POSTGRES_HOST_AUTH_METHOD: trust, POSTGRES_DB: ainet }
    ports: ["127.0.0.1:5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 2s, retries: 30 }
    volumes: ["pgdata:/var/lib/postgresql/data"]
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
  migrate:
    <<: *api
    command: ["alembic", "upgrade", "head"]
  api:
    <<: *api
    environment: { <<: *env, ROLE: api }
    ports: ["8000:8000"]
    depends_on: { migrate: { condition: service_completed_successfully } }
  worker:
    <<: *api
    environment: { <<: *env, ROLE: worker }
    depends_on: { migrate: { condition: service_completed_successfully } }
  scheduler:
    <<: *api
    environment: { <<: *env, ROLE: scheduler }
    depends_on: { migrate: { condition: service_completed_successfully } }
volumes: { pgdata: {} }
